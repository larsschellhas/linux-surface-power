# Device profile: Surface Pro 9 (Intel). Spec supervisor 6. Holds no limit values (G-2): those come from the device's blob.
# SKUs: Surface_Pro_9_for_Business_2038 from a tester's report (linux-surface#2383); Surface_Pro_9_2038 from the public Surface
# driver-pack catalogue (OSDeploy `core/driverpacks/surface.json`, commit 1fcc2829), which lists both SKUs for the same driver
# package (added 23.11.2026, docs/plan.md F5). The 5G model (arm64) has its own SKUs and is not matched.
# Not validated on a device: tested stays false.
tested = false

[match]
sku = ["Surface_Pro_9_for_Business_2038", "Surface_Pro_9_2038"]

[blob]
source = "efivar"

[engine]
variant = "direct"      # the driver package ships SMF core 3.180 (docs/research/09-newer-blobs.md 3)

[outputs]
# pl4: automatic (where powercap reports a value); set false to switch off.
# PL3: Windows writes channel 59 to MSR 0x615 on the Pro 9 Intel (Alder Lake type, client build 0d5efa50;
# docs/research/10-outputs.md 4.1) [C]; a tester measured write, bind and restore.
pl3 = true
