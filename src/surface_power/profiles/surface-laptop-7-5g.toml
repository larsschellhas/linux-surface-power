# Device profile: Surface Laptop 5G 7th Edition with Intel for Business. Spec supervisor 6. Holds no limit values (G-2): those
# come from the device's blob.
# Matched by SKU (DMI product_sku). Source: the public Surface driver-pack catalogue (OSDeploy `core/driverpacks/surface.json`,
# commit 1fcc2829, 30.09.2026; field `SystemId`); catalogue only, no user report yet.
# Created 23.11.2026 without a report from this device (docs/plan.md F5). Not validated on a device: tested stays false, so the
# daemon runs dry-run unless started with --control. A report from the device confirms the SKU.
tested = false

[match]
sku = ["Surface_Laptop_5G_7th_Edition_With_Intel_For_Business_2119"]

[blob]
source = "efivar"

[engine]
variant = "direct"      # the driver package ships SMF core 3.205.23 (docs/research/09-newer-blobs.md 3)

[outputs]
# pl4: automatic (where powercap reports a value). PL3: the blob has channel 59, and Windows writes it to MSR 0x615 bits 12:0 on this
# device (Meteor Lake type, client build f884dca0; docs/research/10-outputs.md 4.1) [C]. Held while its EC inputs are invalid
# (spec outputs 3.1).
pl3 = true
