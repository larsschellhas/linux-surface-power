# Device profile: Surface Pro 10 for Business. Spec supervisor 6. Holds no limit values (G-2): those come from the device's blob.
# The product name is the DMI name; the 5G model has its own name and no profile yet. Not validated on a device: tested stays false,
# so the daemon runs dry-run unless started with --control (test checklist: docs/research/12-remaining-outputs.md 4).
tested = false
# Printed in the report and the daemon log. Tester report, not measured here [H].
notes = ["PL4 also limits the integrated GPU on this model (tester report, linux-surface issue 2331). The daemon writes PL4 only while the EC inputs on its path are valid, and --control starts only if they are valid within 10 s (profile option pl4_requires_ec)."]

[match]
product_name = "Surface Pro 10 for Business"

[blob]
source = "efivar"

[engine]
variant = "direct"      # the driver package ships SMF core 3.204.23 (docs/research/09)

[outputs]
# pl4: automatic (where powercap reports a value). pl3: off (Windows' write of MSR 0x615 not verified for this device). Both are held while their EC inputs are
# invalid (spec outputs 3.1). fan_thresholds: the Pro 10 blob has none of those outputs.
# pl4_requires_ec: --control is refused (dry-run only) unless the EC inputs on the PL4 path are valid within pl4_ec_wait_s seconds
# of the start (spec outputs 3.2).
pl4_requires_ec = true
pl4_ec_wait_s = 10
