# Device profile: Surface Pro 7+. Spec supervisor 6. Holds no limit values (G-2): those come from the device's blob.
# Matched by SKU (DMI product_sku). Source: the public Surface driver-pack catalogue (OSDeploy `core/driverpacks/surface.json`,
# commit 1fcc2829, 30.09.2026; field `SystemId`); 1960 also in user reports (linux-surface/surface-gpe#8,
# linux-surface/kernel#194); 1961 (LTE) from the catalogue only.
# Created 23.11.2026 without a report from this device (docs/plan.md F5). Not validated on a device: tested stays false, so the
# daemon runs dry-run unless started with --control. A report from the device confirms the SKU.
tested = false

[match]
sku = ["Surface_Pro_7+_1960",
       "Surface_Pro_7+_with_LTE_Advanced_1961"]

[blob]
source = "efivar"

[engine]
variant = "direct"      # the driver package ships SMF core 3.205.17 (docs/research/09-newer-blobs.md 3)

[outputs]
# pl4: automatic (where powercap reports a value). PL3: the blob has channel 59, and Windows writes it to MSR 0x615 bits 12:0 on this
# device (Tiger Lake type, client build 18ed0894; docs/research/10-outputs.md 4.1) [C]. Held while its EC inputs are invalid (spec
# outputs 3.1).
pl3 = true
