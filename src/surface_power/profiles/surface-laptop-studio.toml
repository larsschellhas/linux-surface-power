# Device profile: Surface Laptop Studio (1st generation). Spec supervisor 6. Holds no limit values (G-2): those come from the device's blob.
# The product name is the one the kernel's surface_gpe driver matches. Not validated on a device yet.
tested = false

[match]
product_name = "Surface Laptop Studio"

[blob]
source = "efivar"

[engine]
variant = "classic"     # the driver package ships SMF core 3.137 (docs/research/04)

[outputs]
# pl3 / pl4: automatic (PL4 where powercap reports a value, PL3 where the MSR is writable); set false to switch off.
