# Device profile: Surface Pro 8 (Wi-Fi and LTE). Spec supervisor 6. Holds no limit values (G-2): those come from the device's blob.
# The product name is the one the kernel's surface_gpe driver matches. Not validated on a device yet.
tested = false

[match]
product_name = "Surface Pro 8"

[blob]
source = "efivar"

[engine]
variant = "classic"     # the driver package ships SMF core 3.137 (docs/research/04)

[outputs]
# pl4: automatic (where powercap reports a value); set false to switch off. pl3 (MSR 0x615): only with pl3 = true, for devices
# where Windows' write is verified (driver build or measurement); off by default.
# PL3: Windows writes channel 59 to MSR 0x615 on the Pro 8 (Tiger Lake type, client build 18ed0894; docs/research/10-outputs.md 4.1) [C].
pl3 = true
